text: 'The Add Log page refuses to save, shows what is wrong, and keeps what was typed
  when: no pile is chosen; the date is missing or not a date and time; temperature,
  moisture or air temperature is not a whole number; notes are longer than 200 characters;
  or the chosen stage has not been set up. Nothing is saved and no pile is moved.
  Example: a date of ''yesterday'' is refused and the other fields keep their values.'
