text: 'The Add Log page saves a check on one pile with: date and time (required);
  temperature, moisture and outside air temperature (optional whole numbers); whether
  the pile was turned; an optional new stage; and notes (optional, up to 200 characters).
  After saving, the user is returned to the home page. Example: pile 19, 2025-11-09
  08:00, temperature 135, air temperature 41, turned, saves one log with those values.'
