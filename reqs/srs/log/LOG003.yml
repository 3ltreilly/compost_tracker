text: 'Choosing a stage on the Add Log page moves the pile to that stage when the
  log is saved, and the log records that stage. Leaving the stage blank keeps the
  pile where it is, and the log records the pile''s current stage. Example: pile 20
  is in Collection and a log is saved with stage Primary, so pile 20 is now in Primary.'
