text: 'The Add Pile page creates a pile from a pile ID (up to 20 characters), a start
  date (today by default) and a starting stage (required). New piles get the feedstock
  ''horse manure''; feedstock can only be changed in the admin. After saving, the
  user is returned to the home page. Example: ID 24, start date 2025-11-09, stage
  Collection creates pile 24 in Collection.'
