text: 'The Add Pile page refuses to save, shows what is wrong, and keeps what was
  typed when: the ID is blank or already used by another pile, the start date is missing
  or not a date, no stage is chosen, or the chosen stage has not been set up. The
  Add Pile page never changes an existing pile. Example: adding ID 19 when pile 19
  exists shows ''A pile with this ID already exists.'' and pile 19 is unchanged.'
