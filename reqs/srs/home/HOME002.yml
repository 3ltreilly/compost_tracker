text: 'The home page shows the ID of the pile currently in the Primary stage. If more
  than one pile is in Primary it shows the one whose ID sorts first as text (so 10
  comes before 9). If no pile is in Primary the line is left blank. Example: pile
  19 is in Primary, so it shows 19.'
