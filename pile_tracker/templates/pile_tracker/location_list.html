{% extends "base_generic.html" %}

{% block content %}
  <h1>Location List</h1>
  {% if location_list %}
  <ul>
    {% for loc in location_list %}
      <li>
        {{ loc.location }} ({{ loc.days_at_state }} days)
      </li>
    {% endfor %}
  </ul>
  {% else %}
    <p>There are no locations yet.</p>
  {% endif %} 
{% endblock %}
