[project]
name = "compost_tracker"
version = "0.3.0"
description = "Track shit piles"
authors = [{ name = "Bernie", email = "reilly_bernie@mac.com" }]
requires-python = ">=3.12,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Django>=6.1,<7",
    "gunicorn>=26.2.0",
    "pytz>=2026,<2027",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "jamb>=2.0.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "compost_tracker.settings"
python_files = ["tests.py", "test_*.py"]

[tool.uv]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
# Google Python Style Guide: https://google.github.io/styleguide/pyguide.html
line-length = 100       # Google says 80; this project uses 100
indent-width = 4        # Google: indent with 4 spaces
target-version = "py314"
extend-exclude = ["*/migrations/*"]  # generated by Django; not hand-written

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors, including E501 (the line length limit)
    "W",   # pycodestyle warnings (whitespace)
    "F",   # Pyflakes: unused imports and variables, undefined names
    "I",   # import order, Google layout (see [tool.ruff.lint.isort])
    "N",   # pep8-naming: Google's naming rules (snake_case functions, etc.)
    "D",   # pydocstyle: docstrings, Google convention (see below)
    "B",   # flake8-bugbear: e.g. mutable default arguments, which Google bans
    "DJ",  # Django-specific checks
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Google's pylintrc doesn't require docstrings on test functions; their names
# say what they check.
"**/tests/*.py" = ["D103"]

[tool.ruff.lint.pydocstyle]
# Google docstrings: a one-line summary, then Args:, Returns:, Raises: sections.
convention = "google"

[tool.ruff.lint.isort]
# Same as isort's "google" profile: one import per line, sorted by module
# name whether it's `import x` or `from x import y`.
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["typing"]
order-by-type = false

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.jamb]
# SRS documents, one per area of the app; tests link to items in these.
test_documents = ["HOME", "PILE", "LOG", "STAGE"]
trace_to_ignore = ["PRJ"]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.coverage.run]
source = ["compost_tracker", "pile_tracker"]
omit = ["*/migrations/*", "*/test_*.py", "*/tests.py", "*/asgi.py", "*/wsgi.py"]
branch = true
